---
name: AWS Emulator image

on:
  pull_request:
    paths:
      - addons/aws-emulator/Dockerfile
      - .github/workflows/aws-emulator-image.yml
  push:
    branches:
      - main
    paths:
      - addons/aws-emulator/Dockerfile
      - .github/workflows/aws-emulator-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Select image tag
        id: image
        shell: bash
        run: |
          version=$(awk -F= '/^ARG EMULATOR_VERSION=/ {print $2}' addons/aws-emulator/Dockerfile)
          test -n "$version"
          echo "tag=ghcr.io/dyegoe/aws-emulator:${version}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: addons/aws-emulator
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.tag }}
