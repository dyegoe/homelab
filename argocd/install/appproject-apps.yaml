---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
spec:
  description: Standalone tenant apps provisioned via charts/tenant + Kargo (dev/prd promotion), generated by the apps ApplicationSet.
  # sourceRepos stays wide open: unlike addons, this is a short, inherently growing list (one repo
  # per app, from apps/*/config.json) — enumerating it would mean an AppProject edit every time a
  # new app is added, which defeats the point of the argocdProject/config.json data-driven flow.
  # The actual protection boundary for a given app's repo is its own Kargo git-write credential,
  # not this field.
  sourceRepos:
    - '*'
  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*'
  # Namespace: needed because the per-env child Applications (charts/tenant/templates/application.yaml)
  # set CreateNamespace=true for their own <appName>-dev/-prd namespaces.
  # kargo.akuity.io/Project: cluster-scoped (confirmed via CRD), created by charts/tenant/templates/project.yaml.
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: kargo.akuity.io
      kind: Project
  # Derived from what's actually synced into website/website-dev/website-prd today (verified live).
  # kargo.akuity.io is whitelisted broadly since that's this project's whole domain (Warehouse/Stage/
  # ProjectConfig, and Kargo's own runtime Freight/Promotion objects) — everything else is a specific
  # kind, not a wildcard, since app-level workload kinds are the actual thing worth restricting.
  # Note: rbac.authorization.k8s.io deliberately excluded — the kargo-admin/kargo-promoter/kargo-viewer
  # Role/RoleBindings in an app's namespace are provisioned by Kargo's own controller as a side effect
  # of the Project CR, not synced by any ArgoCD Application, so this project never needs to grant it.
  # Adding a new workload kind here is expected to be a normal follow-up PR alongside the app change
  # that needs it, same as any other reviewable diff in this repo.
  namespaceResourceWhitelist:
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Secret
    - group: ''
      kind: ServiceAccount
    - group: ''
      kind: Service
    - group: apps
      kind: Deployment
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
    - group: onepassword.com
      kind: OnePasswordItem
    - group: kargo.akuity.io
      kind: '*'
