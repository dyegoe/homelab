---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.2/manifests/install.yaml
  - grpcroute-argocd-grpc.yaml
  - httproute-argocd-redirect.yaml
  - httproute-argocd.yaml
  - servicemonitor-argocd-application-controller.yaml
  - servicemonitor-argocd-server.yaml
  - servicemonitor-argocd-notifications-controller.yaml
  - onepassword-github-dyegoe-homelab.yaml
  - onepassword-github-dyegoe-website.yaml
  - appproject-addons.yaml
  - appproject-apps.yaml
patches:
  - path: patch-deployments.yaml
    target:
      kind: Deployment
  - path: patch-configmap-argocd-cm.yaml
  - path: patch-configmap-argocd-cmd-params-cm.yaml
  - path: patch-configmap-argocd-rbac-cm.yaml
  - path: patch-secret-argocd-secret.yaml
  - path: patch-service-argocd-server.yaml

# Grafana's sidecar (searchNamespace: ALL) auto-discovers any ConfigMap labeled grafana_dashboard:
# "1" in any namespace. Ported from the old homelab-gitops repo's dashboard.
configMapGenerator:
  - name: grafana-dashboard-argocd
    files:
      - dashboards/argocd.json

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
