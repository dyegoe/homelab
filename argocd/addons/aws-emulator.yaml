---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-emulator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: addons
  source:
    repoURL: https://github.com/dyegoe/homelab.git
    path: addons/aws-emulator
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: aws-emulator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
