---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          # Fixed dev/prd pair, not sourced from the repo - a list generator can only ever
          # produce these two values, so every app gets exactly this env set with nothing to
          # validate (see README's "Standalone apps (ApplicationSet)" section).
          - list:
              elements:
                - env: dev
                - env: prd
          # One apps/<app>/config.json per standalone app - adding an app means adding a file
          # here, not editing this ApplicationSet. matrix cross-joins each discovered app with
          # both envs above to produce e.g. website-dev, website-prd.
          - git:
              repoURL: https://github.com/dyegoe/homelab.git
              revision: main
              files:
                - path: "apps/*/config.json"
  template:
    metadata:
      name: "{{.app}}-{{.env}}"
      annotations:
        # Delegates argocd-update authority to Kargo's dev/prd Stage in this app's Project - see
        # https://docs.kargo.io/user-guide/how-to-guides/argo-cd-integration
        kargo.akuity.io/authorized-stage: "{{.app}}:{{.env}}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        - repoURL: "{{.repoURL}}"
          targetRevision: main
          path: "deploy/overlays/{{.env}}"
        # Per-app-per-env plain manifests owned by this repo (e.g. the GHCR imagePullSecret) - same
        # non-ref extra-source pattern used for addon plain manifests, see README's "Adding a new
        # Application" section.
        - repoURL: https://github.com/dyegoe/homelab.git
          targetRevision: main
          path: "apps/{{.app}}/{{.env}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.app}}-{{.env}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - CreateNamespace=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
