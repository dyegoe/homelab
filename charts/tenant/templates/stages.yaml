{{- range $env := list "dev" "prd" }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: {{ $env }}
  namespace: {{ $.Values.appName }}
spec:
  # Dev accepts newly discovered Freight directly from the Warehouse, while
  # prd accepts only Freight promoted by dev. This keeps prd from deploying
  # an image before it has passed through dev and establishes the promotion
  # chain between the two environments.
  requestedFreight:
    - origin:
        kind: Warehouse
        name: {{ $.Values.appName }}
      sources:
        {{- if eq $env "dev" }}
        direct: true
        {{- else }}
        stages: ["dev"]
        {{- end }}
  promotionTemplate:
    spec:
      vars:
        - name: repoURL
          value: {{ $.Values.repoURL }}
        - name: imageURL
          value: {{ $.Values.imageURL }}
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ "{{ vars.repoURL }}" }}
            checkout:
              - branch: main
                path: ./src
        - uses: kustomize-set-image
          as: update-image
          config:
            path: ./src/deploy/overlays/{{ $env }}
            images:
              - image: ${{ "{{ vars.imageURL }}" }}
                # quote() is load-bearing, not stylistic: a bare-semver tag like "0.1" is valid YAML
                # float syntax, so without quote() Kargo hands this step a JSON number instead of a
                # string and it fails with "images.0.tag: Invalid type. Expected: string, given: number".
                tag: ${{ "{{ quote(imageFrom(vars.imageURL).Tag) }}" }}
        - uses: git-commit
          config:
            path: ./src
            message: ${{ "{{ outputs['update-image'].commitMessage }}" }}
        - uses: git-push
          as: push
          config:
            path: ./src
        - uses: argocd-update
          config:
            apps:
              - name: {{ $.Values.appName }}-{{ $env }}
                sources:
                  # No desiredRevision here, deliberately: dev and prd both push to the same `main`
                  # branch (different overlay paths, so no conflicts). Setting desiredRevision (e.g.
                  # ${{ "{{ outputs.push.commit }}" }}) registers a Stage health check pinned to that
                  # exact commit — a promotion to the OTHER stage then advances `main` out from under
                  # it and flips this Stage Unhealthy until it next promotes. An empty/unset
                  # desiredRevision is a no-op for that check (verified against Kargo v1.11.2 source).
                  # Don't add it back without giving dev/prd separate branches first.
                  - repoURL: ${{ "{{ vars.repoURL }}" }}
{{- end }}
