{{- if .Values.onepassword.imageItem }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-image-auth
  namespace: {{ .Values.appName }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kargo-image-auth
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: image
  dataFrom:
    - extract:
        key: {{ .Values.onepassword.imageItem }}
{{- end }}
