---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Values.appName }}
spec:
  interval: {{ .Values.interval | default "5m0s" }}
  subscriptions:
    - image:
        repoURL: {{ .Values.imageURL }}
        imageSelectionStrategy: SemVer
        discoveryLimit: 5
        strictSemvers: false
