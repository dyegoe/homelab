---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
      - id: check-case-conflict
      - id: check-yaml
        exclude: ^charts/.+/templates/.*\.ya?ml$

  # Helm chart templates (charts/*/templates/*.yaml) are Go-template source, not plain YAML -
  # they're rendered to text before ever being parsed as YAML, so unquoted {{ }} is expected to
  # look like invalid YAML to a raw parser. `helm lint`/`helm template` are what actually validate
  # them (see charts/tenant); check-yaml/yamllint are scoped to real YAML/JSON only.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        exclude: ^charts/.+/templates/.*\.ya?ml$

  # The original pre-commit/mirrors-prettier is archived/unmaintained - this is the current
  # community-maintained successor. Scoped to markdown only so it doesn't compete with yamllint.
  # .claude/ is Claude Code's own skill/tooling content, not this repo's documentation - excluded
  # rather than reformatted/relinted to a style it wasn't written for.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        files: \.md$
        exclude: ^\.claude/

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        exclude: ^\.claude/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # kubeconform doesn't ship a .pre-commit-hooks.yaml and doesn't understand Kustomize on its own -
  # this repo's manifests are Kustomize trees, not flat files. `language: golang` is pre-commit's
  # documented pattern for a Go CLI tool with no native hook repo.
  - repo: local
    hooks:
      - id: kubeconform
        name: kubeconform (kustomize build validation)
        entry: scripts/kustomize-validate.sh
        language: golang
        additional_dependencies:
          - github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
        pass_filenames: false
        files: (kustomization\.yaml|addons/.*\.yaml|argocd/.*\.yaml)$
