---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - sealedsecret-onepassword-connect-credentials.yaml
  - sealedsecret-onepassword-connect-token.yaml

# Grafana's sidecar (searchNamespace: ALL) auto-discovers any ConfigMap labeled grafana_dashboard:
# "1" in any namespace. Ported from the old homelab-gitops repo's dashboard - same 1Password
# Connect product, metrics unchanged.
configMapGenerator:
  - name: grafana-dashboard-onepassword-connect
    files:
      - dashboards/onepassword-connect.json

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
