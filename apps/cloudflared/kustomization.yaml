---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment-cloudflared.yaml
  - service-metrics.yaml
  - servicemonitor.yaml

# Grafana's sidecar (searchNamespace: ALL) auto-discovers any ConfigMap labeled grafana_dashboard:
# "1" in any namespace. Ported from the old homelab-gitops repo's dashboard.
configMapGenerator:
  - name: grafana-dashboard-cloudflared
    files:
      - dashboards/cloudflared.json

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
