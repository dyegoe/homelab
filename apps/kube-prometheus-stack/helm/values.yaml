---
# CRDs are owned by the separate prometheus-operator-crds Application (sync-wave -8) so every
# other addon's ServiceMonitor can render safely regardless of how early it syncs.
crds:
  enabled: false
# Talos runs kube-controller-manager/kube-scheduler as regular kube-system static pods with the
# standard upstream labels, so the chart's default Service+ServiceMonitor for them finds the
# right pods. BUT: as of writing, both still bind their metrics port to 127.0.0.1 (Talos's
# default), so the Service can reach nothing and these targets will show as down until a
# KubeControllerManagerConfig/KubeSchedulerConfig `extraArgs: bind-address: 0.0.0.0` patch is
# added to talos/talconfig.yaml and applied. Left enabled since a down target is harmless.
# etcd is a native Talos host service, not a Kubernetes pod, so it isn't scraped here.
kubeEtcd:
  enabled: false
# No kube-proxy on this cluster - Cilium runs in kube-proxy-less mode (see apps/cilium).
kubeProxy:
  enabled: false
# The previous split-chart stack on this same hardware (3 nodes, 4 cores/32GB each) shipped
# every component with unbounded `resources: {}`, which was enough aggregate pressure to cause
# scheduling/eviction problems. Prometheus/Grafana/Alloy/Loki's numbers below are carried over
# from the values that stack eventually converged on (tuned via its own OOMKill-driven bumps);
# alertmanager/prometheusOperator/kube-state-metrics/node-exporter didn't exist as separate
# components in that stack, so their limits here are conservative starting guesses, not
# battle-tested ones.
prometheus:
  prometheusSpec:
    retention: 15d
    # nil selectors would otherwise only pick up ServiceMonitors/PodMonitors/PrometheusRules
    # labeled `release: kube-prometheus-stack` - every other addon's ServiceMonitor (cilium,
    # cert-manager, external-dns, onepassword, longhorn, cloudflared) is unlabeled, so this has
    # to be false for them to be discovered at all.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # Carried over as-is from the old stack, which validated it at 7d retention and a smaller
    # ServiceMonitor count than we have here (15d, plus Cilium/Hubble/envoy/operator metrics on
    # top). Watch actual usage and raise the limit if Prometheus starts getting OOMKilled.
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi
grafana:
  fullnameOverride: grafana
  defaultDashboardsTimezone: browser
  podAnnotations:
    operator.1password.io/item-path: "vaults/Kubernetes/items/Home Lab Grafana"
    operator.1password.io/item-name: "grafana-admin-password"
  admin:
    existingSecret: grafana-admin-password
    userKey: username
    passwordKey: confirmNew
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  # Chart default is RollingUpdate, which starts the new pod before killing the old one - that
  # deadlocks against a single ReadWriteOnce Longhorn PVC (can't attach to two pods at once) and
  # gets Grafana stuck on every redeploy. Recreate avoids it at the cost of a few seconds downtime.
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 5Gi
  grafana.ini:
    server:
      root_url: https://grafana.nodes.ee
