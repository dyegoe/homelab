---
# CRDs are owned by the separate prometheus-operator-crds Application (sync-wave -8) so every
# other addon's ServiceMonitor can render safely regardless of how early it syncs.
crds:
  enabled: false
# Talos runs kube-controller-manager/kube-scheduler as regular kube-system static pods with the
# standard upstream labels, so the chart's default Service+ServiceMonitor for them finds the
# right pods. BUT: as of writing, both still bind their metrics port to 127.0.0.1 (Talos's
# default), so the Service can reach nothing and these targets will show as down until a
# KubeControllerManagerConfig/KubeSchedulerConfig `extraArgs: bind-address: 0.0.0.0` patch is
# added to talos/talconfig.yaml and applied. Left enabled since a down target is harmless.
# etcd is a native Talos host service, not a Kubernetes pod, so it isn't scraped here.
kubeEtcd:
  enabled: false
# No kube-proxy on this cluster - Cilium runs in kube-proxy-less mode (see apps/cilium).
kubeProxy:
  enabled: false
# The previous split-chart stack on this same hardware (3 nodes, 4 cores/32GB each) shipped
# every component with unbounded `resources: {}`, which was enough aggregate pressure to cause
# scheduling/eviction problems. Prometheus/Grafana/Alloy/Loki's numbers below are carried over
# from the values that stack eventually converged on (tuned via its own OOMKill-driven bumps);
# alertmanager/prometheusOperator/kube-state-metrics/node-exporter didn't exist as separate
# components in that stack, so their limits here are conservative starting guesses, not
# battle-tested ones.
prometheus:
  prometheusSpec:
    retention: 15d
    # The bundled "kubernetes-mixin" dashboards (Compute Resources / Namespace, Pod, Workload, ...)
    # all key off a hidden $cluster template variable sourced from this label. Without it, every
    # metric has no `cluster` label at all, the variable resolves to nothing, and those panels
    # show "No data" even though the underlying data is fine.
    externalLabels:
      cluster: k8s.nodes.ee
    # nil selectors would otherwise only pick up ServiceMonitors/PodMonitors/PrometheusRules
    # labeled `release: kube-prometheus-stack` - every other addon's ServiceMonitor (cilium,
    # cert-manager, external-dns, onepassword, longhorn, cloudflared) is unlabeled, so this has
    # to be false for them to be discovered at all.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # Carried over as-is from the old stack, which validated it at 7d retention and a smaller
    # ServiceMonitor count than we have here (15d, plus Cilium/Hubble/envoy/operator metrics on
    # top). Watch actual usage and raise the limit if Prometheus starts getting OOMKilled.
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    # The telegram-bot-token Secret is created by the OnePasswordItem CR in
    # onepassword-telegram-bot-token.yaml (not the operator.1password.io annotation pattern used for
    # grafana/cloudflared) - confirmed live that the annotation-based auto-inject path doesn't react to
    # Alertmanager's StatefulSet-owned pod (matches a limitation the old homelab-gitops repo's own
    # comments already flagged for this operator). `secrets:` below mounts the resulting Secret into
    # the pod at /etc/alertmanager/secrets/telegram-bot-token/<key>.
    secrets:
      - telegram-bot-token
  # Ported from the old homelab-gitops repo's Alertmanager config. Only route/receivers are set here -
  # global/inhibit_rules/templates are left alone so the chart's own sensible defaults (severity-based
  # inhibition, etc.) still apply via Helm's map merge. The chart's default route already carves out
  # Watchdog (kube-prometheus-stack's built-in always-firing heartbeat, confirmed live) to the 'null'
  # receiver - kept here so it doesn't spam Telegram, and doubles as the "did this pipeline actually
  # wire up" signal (resolves paths through Watchdog->null instead, still exercises the routing tree).
  config:
    route:
      receiver: telegram
      group_by:
        - alertname
        - namespace
        - job
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
    receivers:
      - name: "null"
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/telegram-bot-token/credential
            chat_id_file: /etc/alertmanager/secrets/telegram-bot-token/chat_id
            send_resolved: true
prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
# Every physical node in this cluster is Linux - the chart also bundles a Node Exporter dashboard
# per OS (AIX, macOS/darwin) that will never have data here. Linux stays enabled (default).
nodeExporter:
  operatingSystems:
    aix:
      enabled: false
    darwin:
      enabled: false
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    # cpu limit was 50m - CPUThrottlingHigh fired at 66-82% throttled periods on all 3 nodes despite
    # only ~5m average usage. node-exporter's /proc+/sys scan on each scrape is a short CPU burst, not
    # sustained load, so the CFS quota gets exhausted in a fraction of a period even though the
    # time-averaged rate looks tiny. Bumped for burst headroom, not because it's using more CPU.
    # First bump (50m -> 200m, upstream's own suggested value) helped but wasn't enough - 21-49%
    # throttled on stable 28min-old pods, still above the 25% alert threshold on 2 of 3 nodes.
    limits:
      cpu: 300m
      memory: 64Mi
grafana:
  fullnameOverride: grafana
  defaultDashboardsTimezone: browser
  podAnnotations:
    operator.1password.io/item-path: "vaults/Kubernetes/items/Home Lab Grafana"
    operator.1password.io/item-name: "grafana-admin-password"
  admin:
    existingSecret: grafana-admin-password
    userKey: username
    passwordKey: confirmNew
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      # cpu limit was 100m - CPUThrottlingHigh fired at 70-75% throttled periods. Same burst-vs-limit
      # mismatch as node-exporter below, made worse by this session's dashboard-porting work: the
      # sidecar now diffs ~10 more ConfigMaps across every namespace (searchNamespace: ALL).
      # First bump (100m -> 300m) helped (75% -> 39%) but wasn't enough on its own.
      limits:
        cpu: 500m
        memory: 128Mi
  # Chart default is RollingUpdate, which starts the new pod before killing the old one - that
  # deadlocks against a single ReadWriteOnce Longhorn PVC (can't attach to two pods at once) and
  # gets Grafana stuck on every redeploy. Recreate avoids it at the cost of a few seconds downtime.
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 5Gi
  grafana.ini:
    server:
      root_url: https://grafana.nodes.ee
  # Loki isn't part of this chart, so unlike Prometheus/Alertmanager it isn't auto-provisioned -
  # has to be added by hand.
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
