---
# SingleBinary mode: no object storage needed, everything on one Longhorn-backed PVC. This is
# a 3-node homelab, not the tens-of-GB/day scale SimpleScalable/Distributed modes are built for.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-08-15"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  persistence:
    enabled: true
    storageClass: longhorn
    size: 20Gi
    # Chart default (true) sets whenScaled/whenDeleted to Delete, so a Helm upgrade that
    # recreates the StatefulSet - or scaling to 0 - would silently wipe all log history.
    enableStatefulSetAutoDeletePVC: false

# The chart's own guard only zeroes these out at template time for SingleBinary mode - the
# chart's own validation still checks the raw values, so they have to be zeroed explicitly here.
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

# No object storage backend in SingleBinary mode - MinIO isn't needed.
minio:
  enabled: false

# Alloy and Grafana talk to the singleBinary Service directly inside the cluster, no need for
# the chart's own nginx gateway in front of it.
gateway:
  enabled: false

# Daemonset that writes/reads its own canary logs via the gateway - skipped since gateway is off.
lokiCanary:
  enabled: false

test:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false
  serviceMonitor:
    enabled: true
