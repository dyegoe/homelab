---
# The kargo chart's own kargo-controller-argocd ClusterRole/ClusterRoleBinding (suppressed here via
# argocd.dataPlane.kargoController.install: false in helm/values.yaml) grants get/list/patch/watch
# on argoproj.io/Application CLUSTER-WIDE - every namespace, every Application, not just the ones
# under the apps AppProject. The kargo.akuity.io/authorized-stage annotation (see
# charts/tenant/templates/application.yaml) is NOT Kubernetes RBAC - it's a check Kargo's own
# controller code makes in-process before acting on an Application, on top of whatever raw RBAC it
# holds (see https://docs.kargo.io/user-guide/how-to-guides/argo-cd-integration). Kubernetes RBAC
# can't natively scope by AppProject membership or by name pattern (only exact resourceNames, which
# would mean editing this file every time a new app is onboarded - the same maintenance burden
# already rejected for the apps AppProject's sourceRepos, see argocd/install/appproject-apps.yaml).
# A namespace-scoped Role is the real, maintenance-free tightening available: every Application in
# this cluster (addons, ArgoCD's own, and every tenant app's dev/prd pair) lives in the argocd
# namespace today, so this cuts the blast radius from "cluster-wide" to "argocd namespace only"
# with no per-app edits going forward. RoleBinding is in the sibling rbac-argocd-rolebinding.yaml
# (one resource per file, matching this addon's other manifests).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kargo-controller-argocd
  namespace: argocd
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    verbs:
      - get
      - list
      - patch
      - watch
