---
# CRDs (Warehouse/Stage/Project/...) are bundled in this chart and installed as part of it -
# unlike prometheus-operator-crds, nothing else in this cluster needs them to exist early, so no
# separate CRD-only Application is needed here.
api:
  # Used for cert/OIDC-issuer/callback URL generation - must match the HTTPRoute hostname in
  # httproute-kargo.yaml.
  host: kargo.nodes.ee
  tls:
    # Cilium's central Gateway (addons/gateway) terminates TLS with the shared *.nodes.ee wildcard
    # cert, same as Grafana/Prometheus - the API server itself serves plain HTTP (Service port 80,
    # confirmed via `helm template`). terminatedUpstream still makes Kargo generate https:// URLs
    # even though its own listener is plain HTTP, since TLS is terminated upstream at the Gateway.
    enabled: false
    terminatedUpstream: true
  secret:
    # References the Secret materialized by onepassword-kargo-admin.yaml (OnePasswordItem
    # "kargo-admin") instead of inlining a password hash/signing key here. Must contain
    # ADMIN_ACCOUNT_PASSWORD_HASH and ADMIN_ACCOUNT_TOKEN_SIGNING_KEY - see README.md's Kargo
    # section for how those are generated and stored in 1Password.
    name: kargo-admin
  # kargo-admin is loaded via envFrom, not re-read at runtime - without Reloader, rotating it in
  # 1Password updates the Secret but the running pod keeps the stale admin password hash/signing
  # key until something else happens to restart it. annotations (not podAnnotations) is required -
  # Reloader's auto annotation has to sit on the Deployment itself, same as grafana/external-dns.
  annotations:
    reloader.stakater.com/auto: "true"
  # Small, fixed-purpose control plane components - conservative limits consistent with every
  # other addon's values.yaml on this 3-node/32GB-per-node hardware, not battle-tested yet (no
  # Warehouses/Stages exist until the standalone website app is ready - see README.md).
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
controller:
  argocd:
    # Default (false) makes the controller's Application cache watch cluster-wide, which requires
    # a cluster-wide ClusterRole/ClusterRoleBinding - get/list/patch/watch on argoproj.io/Application
    # in every namespace, not just the ones under the apps AppProject. Setting this true switches
    # the controller-runtime cache to cache.Options.DefaultNamespaces = {argocd: {}} (see
    # cmd/controlplane/controller.go in kargo's source, v1.11.2), which makes it issue a
    # NAMESPACED watch instead of a cluster-scoped one - the chart then renders a namespace-scoped
    # Role/RoleBinding instead of the ClusterRole/ClusterRoleBinding (same gate in
    # charts/kargo/templates/argocd/role.yaml and controller/cluster-roles.yaml). This is the
    # chart's own supported mechanism for narrowing that RBAC, not a hand-rolled one - a namespaced
    # Role alone (without this flag) cannot satisfy a cluster-scoped watch call under any binding,
    # which is exactly what broke the website:dev promotion on 2026-08-26 (argocd-update step
    # timed out - the client.Get() call blocks on the cache's initial sync, which never completes
    # if the watch is Forbidden). The chart's own doc note ("should usually be left false") is
    # about older Argo CD versions / Applications living outside Argo CD's own namespace - every
    # Application in this cluster lives in the argocd namespace by design (see Architecture in
    # README.md), so that caveat doesn't apply here.
    watchArgocdNamespaceOnly: true
  # api and garbageCollector have no Prometheus metrics support in this chart at all - only
  # controller/managementController/webhooksServer do. Selector-less Prometheus
  # (serviceMonitorSelectorNilUsesHelmValues: false in kube-prometheus-stack's values.yaml) already
  # picks up any ServiceMonitor cluster-wide, so no additionalLabels needed here.
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
garbageCollector:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
externalWebhooksServer:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
webhooksServer:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
managementController:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
