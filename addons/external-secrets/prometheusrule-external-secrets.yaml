---
# Picked up by kube-prometheus-stack's Prometheus from any namespace, without a `release:` label,
# because addons/kube-prometheus-stack/helm/values.yaml sets ruleSelectorNilUsesHelmValues: false.
#
# The metric labels are ESO's own: `name` is the ExternalSecret, and its namespace lands in
# `exported_namespace` - Prometheus's `namespace` label on these series is always `external-secrets`
# (the scrape target's namespace), which is what Alertmanager's group_by sees. Both alerts therefore
# group into one Telegram notification per event, which is the right shape - one broken store or a
# wedged controller takes every ExternalSecret down together.
#
# Motivated by the 2026-09-08 incident (README: External Secrets Operator > Known issue): every
# ExternalSecret sat NotReady for ~30h with nothing paging, because nothing watched the condition.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: external-secrets
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: external-secrets
    app.kubernetes.io/managed-by: argocd
spec:
  groups:
    - name: external-secrets
      rules:
        - alert: ExternalSecretNotReady
          # A single ExternalSecret stuck NotReady: usually a 1Password item that was renamed,
          # deleted, or has a field in the built-in URL/Notes widget instead of a custom field
          # (README: Known gotcha: URLs, Notes, and Sections aren't extracted). 15m rides out a
          # transient 1Password API/DNS blip, which ESO retries on its own.
          expr: externalsecret_status_condition{condition="Ready", status="False"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: ExternalSecret {{ $labels.exported_namespace }}/{{ $labels.name }} is not Ready
            description: >-
              ExternalSecret {{ $labels.exported_namespace }}/{{ $labels.name }} has had Ready=False
              for more than 15 minutes. Check its status message with
              `kubectl -n {{ $labels.exported_namespace }} describe externalsecret {{ $labels.name }}`.
            runbook_url: https://github.com/dyegoe/homelab/blob/main/README.md#external-secrets-operator
        - alert: ExternalSecretsMostlyNotReady
          # Half or more of all ExternalSecrets NotReady at once is never an item problem - it's the
          # ClusterSecretStore or the controller itself. The known cause is the 1Password SDK's WASM
          # instance wedging after a network error; the fix is a controller restart. Denominator:
          # every ExternalSecret exports a Ready=True series (value 0 or 1), so counting those
          # series is the total number of ExternalSecrets.
          expr: |
            sum(externalsecret_status_condition{condition="Ready", status="False"})
              /
            count(externalsecret_status_condition{condition="Ready", status="True"})
              >= 0.5
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "{{ $value | humanizePercentage }} of all ExternalSecrets are not Ready"
            description: >-
              Half or more of the cluster's ExternalSecrets have been NotReady for 10 minutes. This
              is a store/controller-level failure, not a per-item one. If the controller log shows
              `wasm error: out of bounds memory access`, restart it:
              `kubectl -n external-secrets rollout restart deploy/external-secrets`.
            runbook_url: https://github.com/dyegoe/homelab/blob/main/README.md#known-issue-sdk-wasm-instance-wedges-after-a-network-error-recheck-when-onepassword-sdk-go-moves-past-v041
