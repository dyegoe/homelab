---
# Template for one CKA-practice VM, using the disk from datavolume-node.yaml. Not applied by
# ArgoCD - disposable, user-applied resource. See ./README.md.
#
# To create additional nodes, copy this file and replace every "cka-node1" with e.g. "cka-node2".
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: cka-node1
  namespace: kubevirt-study
spec:
  running: false
  template:
    metadata:
      labels:
        kubevirt.io/vm: cka-node1
    spec:
      domain:
        cpu:
          cores: 2
        resources:
          requests:
            memory: 4Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: cka-node1-disk
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: cka-node1
              users:
                - name: ubuntu
                  sudo: ALL=(ALL) NOPASSWD:ALL
                  lock_passwd: false
                  plain_text_passwd: 'kubevirt'
                  shell: /bin/bash
              ssh_pwauth: true
              packages:
                - qemu-guest-agent
              runcmd:
                - systemctl enable --now qemu-guest-agent
