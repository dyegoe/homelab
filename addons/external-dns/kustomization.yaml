---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Grafana's sidecar (searchNamespace: ALL) auto-discovers any ConfigMap labeled grafana_dashboard:
# "1" in any namespace. Ported from the old homelab-gitops repo's dashboard.
configMapGenerator:
  - name: grafana-dashboard-external-dns
    files:
      - dashboards/external-dns.json

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
