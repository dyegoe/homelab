---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Grafana's sidecar (searchNamespace: ALL) auto-discovers any ConfigMap labeled grafana_dashboard:
# "1" in any namespace. Hand-built rather than ported from the official grafana/loki loki-mixin: the
# mixin's dashboards (reads/writes/chunks/etc.) are written for a microservices-split deployment and
# key panels off recording rules (cluster_job_route:*:sum_rate) this cluster doesn't deploy, plus a
# "cluster" label this Prometheus never sets. Not worth the invasive fix for a SingleBinary homelab
# deployment - this dashboard covers the same operational signals (request rate/latency, ingestion,
# discards, chunk flush, query latency) with panels verified against live Prometheus metric names.
configMapGenerator:
  - name: grafana-dashboard-loki
    files:
      - dashboards/loki.json

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
