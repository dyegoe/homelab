---
# Talos's own json_lines log shipper (machine.logging.destinations) runs as a host-network
# process on each node, outside any pod - a ClusterIP would depend on Cilium's socket-LB
# extending host-reachable-services all the way to Talos's own machined process, which isn't
# verified. A LoadBalancer IP (via the existing Cilium LB-IPAM pool/BGP, same as the gateway)
# is a plain routable address any client - in-cluster or not - can reach, no assumptions needed.
apiVersion: v1
kind: Service
metadata:
  name: alloy-talos-logs
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: alloy
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: alloy
  ports:
    - name: talos-logs
      port: 5140
      targetPort: talos-logs
      protocol: TCP
