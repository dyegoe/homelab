---
# Read-only R2 token scoped to the `omni-etcd-backup` bucket (1Password item
# `homelab-omni-etcd-backup-ro`, Kubernetes vault). It is IP-filtered to the home IP, which is what
# the cluster egresses from. Explicit `data` rather than `dataFrom.extract`: only these three fields
# are needed. The 1Password SDK provider takes `<item>/[section/]<field>` in `key` for `data`
# entries; `property` only applies to `dataFrom.extract`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: r2-omni-etcd-backup-ro
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: r2-omni-etcd-backup-ro
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: homelab-omni-etcd-backup-ro/AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: homelab-omni-etcd-backup-ro/AWS_SECRET_ACCESS_KEY
    - secretKey: AWS_ENDPOINTS
      remoteRef:
        key: homelab-omni-etcd-backup-ro/AWS_ENDPOINTS
