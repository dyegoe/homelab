---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-emulator
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aws-emulator
  template:
    metadata:
      labels:
        app: aws-emulator
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: emulator
          image: ghcr.io/dyegoe/aws-emulator:1.0.341-9d58bdd7ef48c1ecabfa0116211da9ee63a270c9@sha256:f335810a796e9b53b44cc408b74fbfd648db342e89fc2cb2d8fdba7fe65fcbc8
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: emulator-home
              mountPath: /home/emulator/.aws
            - name: emulator-tmp
              mountPath: /tmp
          startupProbe:
            exec:
              command:
                - curl
                - --fail
                - --silent
                - --cacert
                - /home/emulator/.aws/emulator/9297/ca.pem
                - https://127.0.0.1:9297/__admin/health
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command:
                - curl
                - --fail
                - --silent
                - --cacert
                - /home/emulator/.aws/emulator/9297/ca.pem
                - https://127.0.0.1:9297/__admin/health
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - curl
                - --fail
                - --silent
                - --cacert
                - /home/emulator/.aws/emulator/9297/ca.pem
                - https://127.0.0.1:9297/__admin/health
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
        - name: proxy
          image: docker.io/nginxinc/nginx-unprivileged:1.31.7-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
          command:
            - /bin/sh
            - /etc/aws-emulator/proxy-entrypoint.sh
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            exec:
              command:
                - curl
                - --fail
                - --silent
                - --cacert
                - /etc/aws-emulator/backend-ca/ca.crt
                - --resolve
                - aws.nodes.ee:8443:127.0.0.1
                - https://aws.nodes.ee:8443/__admin/health
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: emulator-home
              mountPath: /home/emulator/.aws
              readOnly: true
            - name: backend-tls
              mountPath: /etc/aws-emulator/tls
              readOnly: true
            - name: backend-ca
              mountPath: /etc/aws-emulator/backend-ca
              readOnly: true
            - name: proxy-config
              mountPath: /etc/aws-emulator/config
              readOnly: true
            - name: proxy-config
              mountPath: /etc/aws-emulator/proxy-entrypoint.sh
              subPath: proxy-entrypoint.sh
              readOnly: true
            - name: proxy-tmp
              mountPath: /tmp
      volumes:
        - name: emulator-home
          emptyDir:
            medium: Memory
        - name: emulator-tmp
          emptyDir: {}
        - name: proxy-tmp
          emptyDir: {}
        - name: proxy-config
          configMap:
            name: aws-emulator-proxy
        - name: backend-tls
          secret:
            secretName: aws-emulator-backend-tls
            defaultMode: 0440
        - name: backend-ca
          configMap:
            name: aws-emulator-backend-ca
