---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - certificate.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - backendtlspolicy.yaml
  - ciliumnetworkpolicy.yaml
configMapGenerator:
  - name: aws-emulator-proxy
    files:
      - nginx.conf
      - proxy-entrypoint.sh
  - name: aws-emulator-backend-ca
    files:
      - ca.crt=isrgrootx1.pem
generatorOptions:
  disableNameSuffixHash: true
