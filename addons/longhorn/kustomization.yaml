---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - clusterrole-longhorn-csi-resizer-vac.yaml
  - clusterrolebinding-longhorn-csi-resizer-vac.yaml
  - externalsecret-longhorn-r2-backup.yaml
  - httproute-longhorn-redirect.yaml
  - prometheusrule-longhorn-backup.yaml
  - recurringjob-backup-daily.yaml
  - recurringjob-snapshot-cleanup.yaml
  - storageclass-longhorn-backup.yaml

# Grafana's sidecar (searchNamespace: ALL) auto-discovers any ConfigMap labeled grafana_dashboard:
# "1" in any namespace. Ported from the old homelab-gitops repo's dashboards.
configMapGenerator:
  - name: grafana-dashboard-longhorn
    files:
      - dashboards/longhorn.json
      - dashboards/s-longhorn-volumes.json
      - dashboards/s-pvc-capacity.json

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
