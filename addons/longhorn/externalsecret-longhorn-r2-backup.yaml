---
# Credentials for the Longhorn backup target (Cloudflare R2 bucket `longhorn-backup`, see #129).
# The 1Password item's custom fields must be labelled exactly AWS_ACCESS_KEY_ID,
# AWS_SECRET_ACCESS_KEY and AWS_ENDPOINTS: ESO copies field labels straight into the Secret keys,
# which are the names Longhorn's S3 client reads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-r2-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: longhorn-r2-backup
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: homelab-longhorn-r2-backup
