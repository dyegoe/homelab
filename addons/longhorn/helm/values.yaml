---
preUpgradeChecker:
  jobEnabled: false
networkPolicies:
  # v1.12 chart defaults this to true independently of `enabled` (which stays false), and it
  # blocks cross-namespace Prometheus scrapes of longhorn-manager:9500 (TargetDown). Disable to
  # restore the no-restriction behavior this cluster had before the chart bump.
  restrictInternalTraffic: false
defaultSettings:
  # Automatically use the available space on /var/mnt/longhorn
  createDefaultDiskLabeledNodes: false
  defaultDataPath: /var/mnt/longhorn
  # 2, not 3, on purpose: this cluster only has 3 nodes, so 3 replicas leaves no
  # spare node for Longhorn to relocate a replica onto during a node drain/evict
  # (it can only double up on an already-occupied node via replicaSoftAntiAffinity
  # instead). 2 replicas always has one genuinely free node to land on.
  defaultReplicaCount: 2
  replicaSoftAntiAffinity: true
  storageMinimalAvailablePercentage: 10
  guaranteedInstanceManagerCPU: 12
  upgradeChecker: false
persistence:
  defaultClass: true
  defaultClassReplicaCount: 2
  reclaimPolicy: Retain
csi:
  kubeletRootDir: /var/lib/kubelet
metrics:
  serviceMonitor:
    enabled: true
    interval: 30s
longhornUI:
  replicas: 1
httproute:
  enabled: true
  parentRefs:
    - namespace: gateway # Using central gateway in "gateway" namespace
      name: core
      sectionName: https # Target specific listener
  hostnames:
    - longhorn.nodes.ee
  path: /
  pathType: PathPrefix
