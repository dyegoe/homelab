---
preUpgradeChecker:
  jobEnabled: false
networkPolicies:
  # v1.12 chart defaults this to true independently of `enabled` (which stays false), and it
  # blocks cross-namespace Prometheus scrapes of longhorn-manager:9500 (TargetDown). Disable to
  # restore the no-restriction behavior this cluster had before the chart bump.
  restrictInternalTraffic: false
defaultSettings:
  # Automatically use the available space on /var/mnt/longhorn
  createDefaultDiskLabeledNodes: false
  defaultDataPath: /var/mnt/longhorn
  # 2, not 3, on purpose: this cluster only has 3 nodes, so 3 replicas leaves no
  # spare node for Longhorn to relocate a replica onto during a node drain/evict
  # (it can only double up on an already-occupied node via replicaSoftAntiAffinity
  # instead). 2 replicas always has one genuinely free node to land on.
  defaultReplicaCount: 2
  replicaSoftAntiAffinity: true
  # Safety net for the soft anti-affinity above: if an outage leaves two replicas of a volume on
  # one node, move one back to a free node once it's available. Balancing is per volume only: a
  # volume whose replicas are already on distinct nodes counts as balanced, so this does NOT
  # spread replicas across nodes cluster-wide (see #94).
  replicaAutoBalance: best-effort
  # When a node comes back from an outage after its replicas were rebuilt elsewhere, its old replica
  # directories (and any leftover instance-manager processes) become orphans. Delete them
  # automatically after the default 300s grace period instead of leaving them on disk (#94).
  orphanResourceAutoDeletion: replica-data;instance
  storageMinimalAvailablePercentage: 10
  guaranteedInstanceManagerCPU: 12
  upgradeChecker: false
# Cloudflare R2 bucket `longhorn-backup` (S3-compatible, free under 10 GB; see #129). The endpoint
# and keys come from the longhorn-r2-backup Secret (externalsecret-longhorn-r2-backup.yaml); the
# region in the URL is `auto` because R2 has none.
defaultBackupStore:
  backupTarget: s3://longhorn-backup@auto/
  backupTargetCredentialSecret: longhorn-r2-backup
  pollInterval: 300
persistence:
  defaultClass: true
  defaultClassReplicaCount: 2
  reclaimPolicy: Retain
csi:
  kubeletRootDir: /var/lib/kubelet
metrics:
  serviceMonitor:
    enabled: true
    interval: 30s
longhornUI:
  replicas: 1
httproute:
  enabled: true
  parentRefs:
    - namespace: gateway # Using central gateway in "gateway" namespace
      name: core
      sectionName: https # Target specific listener
  hostnames:
    - longhorn.nodes.ee
  path: /
  pathType: PathPrefix
