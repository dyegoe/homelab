---
# Picked up by kube-prometheus-stack's Prometheus from any namespace (ruleSelectorNilUsesHelmValues:
# false), same as addons/external-secrets/prometheusrule-external-secrets.yaml. Metric semantics:
# https://longhorn.io/docs/1.13.0/monitoring/metrics/ (longhorn_backup_state: 0=New, 1=Pending,
# 2=InProgress, 3=Completed, 4=Error, 5=Unknown).
#
# Only catches backups that ran and failed. A backup that never starts (job not scheduled, volume
# not in the `backup` group, target unreachable so nothing is created) produces no series, so check
# `kubectl -n longhorn-system get backuptargets` and the README's restore drill periodically too.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: longhorn-backup
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/instance: longhorn
    app.kubernetes.io/managed-by: argocd
spec:
  groups:
    - name: longhorn-backup
      rules:
        - alert: LonghornBackupFailed
          expr: longhorn_backup_state == 4
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Longhorn backup {{ $labels.backup }} of volume {{ $labels.volume }} failed
            description: >-
              Backup {{ $labels.backup }} of volume {{ $labels.volume }} is in the Error state.
              Check `kubectl -n longhorn-system describe backups.longhorn.io {{ $labels.backup }}`
              and that the longhorn-r2-backup Secret is Ready and the R2 token is still valid.
            runbook_url: https://github.com/dyegoe/homelab/blob/main/README.md#backups-cloudflare-r2
