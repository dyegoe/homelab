---
kubeProxyReplacement: true
k8sServiceHost: 172.31.86.10
k8sServicePort: 6443
routingMode: native
ipv4NativeRoutingCIDR: 10.0.0.0/8
autoDirectNodeRoutes: true
endpointRoutes:
  enabled: true
bpf:
  masquerade: true
  monitorAggregation: none
socketLB:
  enabled: true
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
securityContext:
  privileged: true
ipam:
  mode: kubernetes
gatewayAPI:
  enabled: true
  enableAlpn: true
bgpControlPlane:
  enabled: true
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    # kube-prometheus-stack's ServiceMonitor CRD is installed by the separate
    # prometheus-operator-crds Application (sync-wave -8, ahead of Cilium's -7), so it's always
    # present by the time this chart renders.
    trustCRDsExist: true
envoy:
  prometheus:
    serviceMonitor:
      enabled: true
operator:
  prometheus:
    serviceMonitor:
      enabled: true
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - dns
      - drop
      - flow
      - flows-to-world
      - httpV2
      - icmp
      - port-distribution
      - tcp
    serviceMonitor:
      enabled: true
