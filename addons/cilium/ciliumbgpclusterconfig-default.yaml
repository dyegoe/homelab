---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: default
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  bgpInstances:
    - name: default
      localASN: 64512
      peers:
        - name: mikrotik
          peerASN: 64512
          peerAddress: 172.31.86.1
          peerConfigRef:
            name: default
