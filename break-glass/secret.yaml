# Long-lived token, filled in by the token controller. Never list it under the ServiceAccount's
# `secrets` field: that makes it "auto-generated" and the legacy token cleaner deletes it after a
# year unused.
apiVersion: v1
kind: Secret
metadata:
  name: break-glass-admin-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: break-glass-admin
type: kubernetes.io/service-account-token
