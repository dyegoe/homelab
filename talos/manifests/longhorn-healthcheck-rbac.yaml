# Read-only access to Longhorn volumes for the Omni upgrade healthcheck in
# talos/healthchecks/longhorn-volumes.yaml. Synced by Omni (kubernetes.manifests, mode full in
# talos/cluster.yaml), not ArgoCD: it only exists to serve that Omni feature.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: omni-longhorn-healthcheck
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: omni-longhorn-healthcheck
  namespace: longhorn-system
rules:
  - apiGroups: [longhorn.io]
    resources: [volumes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: omni-longhorn-healthcheck
  namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: omni-longhorn-healthcheck
subjects:
  - kind: ServiceAccount
    name: omni-longhorn-healthcheck
    namespace: longhorn-system
