---
clusterName: k8s.nodes.ee
endpoint: https://172.31.86.10:6443

# The Talos version to run
talosVersion: v1.14.0
kubernetesVersion: v1.37.0

# Apply these baseline configurations to ALL nodes
controlPlane:
  talosImageURL: factory.talos.dev/metal-installer-secureboot/613e1592b2da41ae5e265e8789429f22e121aab91cb4deb6bc3c0b6262961245
  patches:
    - |-
      machine:
        logging:
          destinations:
            - endpoint: "tcp://172.31.100.2:5140/" # Alloy's alloy-talos-logs LoadBalancer Service
              format: "json_lines"
        kubelet:
          extraArgs:
            rotate-server-certificates: "true"
          extraMounts:
            - destination: /var/mnt/longhorn
              type: bind
              source: /var/mnt/longhorn
              options:
                - bind
                - rshared
                - rw
        network:
          interfaces:
            - deviceSelector:
                physical: true
              dhcp: true
              vip:
                ip: 172.31.86.10 # Your native Talos VIP
    - |-
      apiVersion: v1alpha1
      kind: KubeFlannelCNIConfig
      $$patch: delete # Bypassing default CNI for Cilium
    - |-
      apiVersion: v1alpha1
      kind: KubeProxyConfig
      enabled: false
    - |-
      apiVersion: v1alpha1
      kind: KubeControllerManagerConfig
      extraArgs:
        bind-address: 0.0.0.0
    - |-
      apiVersion: v1alpha1
      kind: KubeSchedulerConfig
      extraArgs:
        bind-address: 0.0.0.0
    - |-
      apiVersion: v1alpha1
      kind: KmsgLogConfig
      name: talos-kernel-logs
      url: "tcp://172.31.100.2:5140/" # Alloy's alloy-talos-logs LoadBalancer Service - kernel/dmesg logs only, `machine.logging.destinations` above covers service logs
    - |-
      apiVersion: v1alpha1
      kind: KubeEtcdEncryptionConfig
      $$patch: delete # talhelper 3.1.17 auto-generates this with the wrong secretbox key name ("key1"); Talos's own
      # generator hardcodes "key2" for secretbox specifically so a pre-1.14 cluster's existing etcd-encrypted Secrets
      # stay decryptable after the multi-doc migration. Delete the buggy auto-generated one, replaced below with the
      # correct name. https://github.com/budimanjojo/talhelper
    - "@./patches/kube-etcd-encryption.sops.yaml"

allowSchedulingOnMasters: true

# Define your specific hardware nodes
nodes:
  - hostname: kihnu.nodes.ee
    ipAddress: 172.31.86.11
    controlPlane: true
    installDisk: /dev/nvme0n1

  - hostname: muhu.nodes.ee
    ipAddress: 172.31.86.12
    controlPlane: true
    installDisk: /dev/nvme0n1

  - hostname: ruhnu.nodes.ee
    ipAddress: 172.31.86.13
    controlPlane: true
    installDisk: /dev/nvme0n1
