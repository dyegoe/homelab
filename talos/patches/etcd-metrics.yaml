# Cluster-wide Talos config patch: plain-HTTP etcd metrics listener on :2381 for
# kube-prometheus-stack (kubeEtcd). etcd is a Talos host service, not a pod, so this has to be set at
# the Talos level (#96). Needs a node reboot to take effect. Referenced from talos/cluster.yaml
# (ConfigPatch 120-k8s-nodes-ee-etcd-metrics).
cluster:
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
