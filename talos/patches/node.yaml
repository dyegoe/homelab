# Cluster-wide Talos config patch: kubelet, VIP and log shipping. Referenced from
# talos/cluster.yaml (ConfigPatch 110-k8s-nodes-ee-node).
---
machine:
  network:
    interfaces:
      - deviceSelector:
          physical: true
        dhcp: true
        vip:
          ip: 172.31.86.10
  logging:
    destinations:
      # Alloy's alloy-talos-logs LoadBalancer Service
      - endpoint: tcp://172.31.100.2:5140/
        format: json_lines
---
# Typed kubelet config (Talos 1.14+). No image pin: Omni sets it from kubernetes.version.
apiVersion: v1alpha1
kind: KubeletConfig
defaultRuntimeSeccompProfileEnabled: true
extraArgs:
  rotate-server-certificates: "true"
---
# Longhorn's data path. The kubelet already sees /var/mnt, so no extraMounts needed.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn # becomes /var/mnt/longhorn, the path Longhorn already uses
volumeType: directory # a directory on the existing EPHEMERAL partition: no disk, no formatting
---
# Kernel/dmesg logs to the same Alloy Service.
apiVersion: v1alpha1
kind: KmsgLogConfig
name: talos-kernel-logs
url: tcp://172.31.100.2:5140/
