---
# Workload isolation (sandboxd): CRI containerd, the kubelet and all pods run in a dedicated PID +
# mount namespace, isolated from machined (PID 1). Default for fresh Talos 1.14 configs; this cluster
# reached 1.14 by in-place upgrade, so it was off until #92 (piloted on ruhnu 2026-10-12: Longhorn
# iSCSI attach/detach, Cilium and metrics all verified inside the sandbox). Only read when sandboxd
# starts, so changing it needs a reboot; `topf apply` alone reports "no reboot" and changes nothing.
# Side effect: hostPID pods (node-exporter) only see sandbox processes, not host services.
apiVersion: v1alpha1
kind: SecurityProfileConfig
workloadIsolation: true
