# Cluster-scoped Omni config patch: kubelet, VIP and log shipping.
metadata:
  namespace: default
  type: ConfigPatches.omni.sidero.dev
  id: 110-k8s-nodes-ee-node
  labels:
    omni.sidero.dev/cluster: k8s-nodes-ee
  annotations:
    name: Node (kubelet, VIP, logging)
spec:
  data: |
    ---
    # Legacy machine.kubelet stays: KubeletConfig has no equivalent for extraMounts (Longhorn's
    # /var/mnt/longhorn bind mount), so the typed document is deleted below.
    apiVersion: v1alpha1
    kind: KubeletConfig
    $patch: delete
    ---
    machine:
      kubelet:
        # Keep in step with the Kubernetes version (Omni -> Cluster -> Upgrade Kubernetes).
        image: ghcr.io/siderolabs/kubelet:v1.37.1
        defaultRuntimeSeccompProfileEnabled: true
        disableManifestsDirectory: true
        extraArgs:
          rotate-server-certificates: "true"
        extraMounts:
          - destination: /var/mnt/longhorn
            type: bind
            source: /var/mnt/longhorn
            options:
              - bind
              - rshared
              - rw
      network:
        interfaces:
          - deviceSelector:
              physical: true
            dhcp: true
            vip:
              ip: 172.31.86.10
      logging:
        destinations:
          # Alloy's alloy-talos-logs LoadBalancer Service
          - endpoint: tcp://172.31.100.2:5140/
            format: json_lines
    ---
    # Kernel/dmesg logs to the same Alloy Service.
    apiVersion: v1alpha1
    kind: KmsgLogConfig
    name: talos-kernel-logs
    url: tcp://172.31.100.2:5140/
